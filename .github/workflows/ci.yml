name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run test --workspace=@anna/evals

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/api/requirements.txt
      - run: pip install -r projects/04-sentiment-bench/requirements.txt
      - run: pip install -r projects/05-forecast-bench/requirements.txt numpy
      - run: python -m verdict.run_benchmark --smoke
        working-directory: projects/04-sentiment-bench
      - run: python -m horizon.run_benchmark --smoke
        working-directory: projects/05-forecast-bench
      - run: python -m signal_desk.run --once
        working-directory: projects/03-research-digest
